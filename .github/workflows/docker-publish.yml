name: Docker Image CI/CD

# Builds the Prokfinder image (docker/Dockerfile) and pushes it to Docker Hub (jprocha2005/prokfinder)
on:
  push:
    branches: [ "main", "master", "docker" ]   # every push to one of these branches -> tag "latest"
  release:
    types: [published]                         # a GitHub release -> also a tag with the release name (e.g., v0.5.0)
  workflow_dispatch:                           # manual run (Actions tab)

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The image takes ~14 GB on disk: the runner keeps only ~14 GB free, so unused preinstalled tools are removed
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: jprocha2005
          password: ${{ secrets.TOKEN_DOCKER_HUB }}

      - name: Image tags
        id: tags
        run: |
          TAGS="jprocha2005/prokfinder:latest"
          if [ "${{ github.event_name }}" = "release" ]; then
            TAGS="${TAGS},jprocha2005/prokfinder:${{ github.event.release.tag_name }}"
          fi
          echo "tags=${TAGS}" >> "${GITHUB_OUTPUT}"

      # The build context is the root of the repository: the Dockerfile copies the scripts (COPY . /opt/prokfinder)
      # and docker/env-*.yml
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
